default:
  image: node:22-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  before_script:
    - npm ci --prefer-offline --no-audit

stages:
  - build
  - test

build:
  stage: build
  script:
    - npm run build

test:
  stage: test
  script:
    - npm run test:ci