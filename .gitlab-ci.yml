default:
  image: node:22-alpine
  tags:
    - docker
    - frontend
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  before_script:
    - npm ci --prefer-offline --no-audit
    - npm run openapi

stages:
  - build
  - test
  - accessibility-route-check
  - accessibility
  - lint
  - release

build:
  stage: build
  script:
    - npm run build
    - apk add --no-cache zip
    - zip -r dist.zip dist/
  artifacts:
    paths:
      - dist.zip
    expire_in: never

lint:
  stage: lint
  script:
    - npm run lint

accessibility-route-check:
  stage: accessibility-route-check
  script:
    - npm run check:routes-no-html

test:
  stage: test
  script:
    - npm run test:ci
  coverage: '/All files\s+\|\s+(\d+\.?\d*)/'
  artifacts:
    when: always
    paths:
      - coverage/
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

accessibility:
  stage: accessibility
  script:
    - npm run test:a11y
  coverage: '/All files\s+\|\s+(\d+\.?\d*)/'
  artifacts:
    when: always
    paths:
      - coverage-a11y/
    reports:
      junit: junit-a11y.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage-a11y/cobertura-coverage.xml
