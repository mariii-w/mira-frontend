  "/v1/public-listings":
    get:
      summary: List public listings
      operationId: getPublicListings
      description: Returns public listings. A listing is visible in public endpoints only when publicationStatus is ACTIVE and moderationStatus is VISIBLE. Without radiusKm, city filters listings by their stored address city. With radiusKm, city is geocoded and used as the search origin for a PostGIS distance search. The response may be paginated when pagination query parameters are provided.
      tags:
        - Listings (Public)
      parameters:
        - name: tagIds
          in: query
          required: false
          description: Filter listings by one or more predefined service tag UUIDs.
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: city
          in: query
          required: false
          description: Filter listings by city. When radiusKm is provided, this city is used as the geocoded search origin instead of an exact city filter.
          schema:
            type: string
        - name: minPrice
          in: query
          required: false
          description: Minimum price, inclusive.
          schema:
            type: number
            format: double
            minimum: 0
        - name: maxPrice
          in: query
          required: false
          description: Maximum price, inclusive.
          schema:
            type: number
            format: double
            minimum: 0
        - "$ref": "#/components/parameters/UserIdQueryParam"
        - name: radiusKm
          in: query
          required: false
          description: Search radius in kilometers around the geocoded city. Requires city.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - "$ref": "#/components/parameters/LimitQueryParam"
        - "$ref": "#/components/parameters/FromQueryParam"
      responses:
        "200":
          description: Listings retrieved successfully.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PublicListingCollectionResponse"
              examples:
                default:
                  summary: Example list of public listings
                  value:
                    items:
                      - listingId: "9c2de8a5-0e11-4fca-95fc-6852ac6f4b31"
                        tags:
                          - tagId: dcf4f0b6-a983-4d88-a4d3-d8d4bd6a7b12
                            name: Laptop support
                            isBarrierefrei: false
                            isActive: true
                        title: Laptop setup and software installation
                        price: 25.0
                        author:
                          userId: "22222222-3333-4444-5555-666666666666"
                          name: Anna
                          surname: Schmidt
                        publishedAt: "2026-04-20T13:00:00Z"
                        location:
                          city: Berlin
                          postalCode: "10115"
                          serviceRadiusKm: 15
                        primaryMedia:
                          mediaId: "11111111-2222-3333-4444-555555555555"
                          url: "https://cdn.mira.example/listings/9c2de8a5-0e11-4fca-95fc-6852ac6f4b31/hero.jpg"
                          altText: Open laptop on a wooden desk
                    cursor:
                      limit: 20
                      next: null
        "400":
          description: Bad Request. One or more query parameters are invalid.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
              examples:
                invalidPagination:
                  value:
                    type: "https://api.mira.example/problems/invalid-query-parameter"
                    title: Bad Request
                    status: 400
                    detail: Query parameter validation failed
                    instance: /v1/listings
                    errors:
                      - field: limit
                        message: must be less than or equal to 100
