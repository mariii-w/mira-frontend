  "/v1/users/{userId}/calendar":
    parameters:
      - "$ref": "#/components/parameters/UserIdPathParam"
    get:
      summary: List calendar bookings of a user
      operationId: getCalendar
      description: "Returns the user's bookings within the requested date range, regardless of role (consumer or provider). Defaults to bookings in CONFIRMED, PAID, AWAITING_CONFIRMATION, or COMPLETED status; pass the status query parameter to retrieve a single specific status. Results are sorted by bookedStart in ascending order. The userId in the path must match the authenticated user, or the authenticated user must have administrator privileges."
      tags:
        - Calendar
      security:
        - bearerHttpAuthentication: []
      parameters:
        - name: from
          in: query
          required: true
          description: Inclusive start date of the requested range, in ISO-8601 date format.
          schema:
            type: string
            format: date
            example: "2026-05-01"
        - name: to
          in: query
          required: true
          description: Inclusive end date of the requested range, in ISO-8601 date format. The range may not exceed 31 days.
          schema:
            type: string
            format: date
            example: "2026-05-31"
        - name: status
          in: query
          required: false
          description: Filter bookings by a single status. When omitted, returns CONFIRMED, PAID, and COMPLETED bookings together.
          schema:
            "$ref": "#/components/schemas/BookingStatus"
      responses:
        "200":
          description: Calendar bookings retrieved successfully.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CalendarBookingsResponse"
              examples:
                default:
                  summary: Example calendar bookings
                  value:
                    items:
                      - bookingId: "3f2a1c8e-2b4d-4f6a-9c1e-7d8b2a5e3f10"
                        listingId: "9c2de8a5-0e11-4fca-95fc-6852ac6f4b31"
                        listing:
                          title: Laptop setup and software installation
                        counterparty:
                          userId: "22bb22bb-2222-2222-2222-bbbbbbbbbbbb"
                          name: Anna
                          surname: Schmidt
                        status: CONFIRMED
                        serviceAddress:
                          street: "Brunnenstraße"
                          houseNumber: "25"
                          city: Berlin
                          postalCode: "10119"
                        totalPrice: 37.5
                        bookedStart: "2026-05-05T14:00:00Z"
                        bookedEnd: "2026-05-05T15:30:00Z"
                        createdAt: "2026-04-28T10:00:00Z"
        "400":
          description: Bad Request. One or more path or query parameters are invalid.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
              examples:
                invalidRange:
                  value:
                    type: "https://api.mira.example/problems/invalid-query-parameter"
                    title: Bad Request
                    status: 400
                    detail: Query parameter validation failed
                    instance: /v1/users/11aa11aa-1111-1111-1111-aaaaaaaaaaaa/calendar
                    errors:
                      - field: to
                        message: "must not be more than 31 days after 'from'"
