components:
  securitySchemes:
    bearerHttpAuthentication:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token using a JWT
    refreshTokenCookieAuthentication:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly refresh token cookie used by POST /v1/auth/refresh.
  parameters:
    UserIdPathParam:
      name: userId
      in: path
      required: true
      description: User UUID.
      schema:
        "$ref": "#/components/schemas/UserId"
    UserIdQueryParam:
      name: userId
      in: query
      required: false
      description: Optional user UUID used to filter resources by user.
      schema:
        "$ref": "#/components/schemas/UserId"
    CredentialIdPathParam:
      name: credentialId
      in: path
      required: true
      description: Credential UUID.
      schema:
        "$ref": "#/components/schemas/CredentialId"
    VerificationIdPathParam:
      name: verificationId
      in: path
      required: true
      description: Credential verification UUID.
      schema:
        "$ref": "#/components/schemas/VerificationId"
    LimitQueryParam:
      name: limit
      in: query
      required: false
      description: Optional maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    FromQueryParam:
      name: from
      in: query
      required: false
      description: Return items starting from this cursor. Use the cursor.next value from the previous response. Omit this parameter to request the first page.
      schema:
        type: string
    ListingIdParam:
      name: listingId
      in: path
      required: true
      description: Listing UUID.
      schema:
        type: string
        format: uuid
    MediaIdParam:
      name: mediaId
      in: path
      required: true
      description: Media UUID.
      schema:
        type: string
        format: uuid
    BookingIdParam:
      name: bookingId
      in: path
      required: true
      description: Booking UUID.
      schema:
        type: string
        format: uuid
    ProviderIdParam:
      name: userId
      in: path
      required: true
      description: Provider user UUID.
      schema:
        type: string
        format: uuid
    ExceptionIdPathParam:
      name: exceptionId
      in: path
      required: true
      description: Schedule exception UUID.
      schema:
        type: string
        format: uuid
  schemas:
    UserId:
      type: string
      format: uuid
    CredentialId:
      type: string
      format: uuid
    VerificationId:
      type: string
      format: uuid
    PatchUserProfileRequest:
      type: object
      description: Partial user profile update payload. Non-null fields update the corresponding profile value. Omitted fields and fields explicitly set to null are ignored.
      additionalProperties: false
      properties:
        username:
          oneOf:
            - "$ref": "#/components/schemas/Username"
            - type: "null"
        firstName:
          oneOf:
            - "$ref": "#/components/schemas/FirstName"
            - type: "null"
        lastName:
          oneOf:
            - "$ref": "#/components/schemas/LastName"
            - type: "null"
        userType:
          oneOf:
            - "$ref": "#/components/schemas/UserType"
            - type: "null"
        bio:
          oneOf:
            - "$ref": "#/components/schemas/Bio"
            - type: "null"
        selfSummary:
          oneOf:
            - "$ref": "#/components/schemas/SelfSummary"
            - type: "null"
        isPublic:
          type: boolean
          description: Indicates whether the user wants the profile to be publicly visible. A profile is publicly accessible only when isPublic is true and registrationComplete is true.
        accessibilityPreferences:
          type: array
          uniqueItems: true
          items:
            "$ref": "#/components/schemas/AccessibilityPreference"
        privateAddress:
          oneOf:
            - "$ref": "#/components/schemas/UserAddressRequest"
            - type: "null"
    SubmitCredentialRequest:
      type: object
      required:
        - credentialType
        - file
      additionalProperties: false
      properties:
        credentialType:
          "$ref": "#/components/schemas/CredentialType"
        file:
          type: string
          format: binary
          description: Evidence file uploaded for the credential claim. Supported media types are defined by the credential-evidence media validation rules.
    UpdateCredentialRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        isVisible:
          type: boolean
          description: Whether the credential may appear in public profile verification badge data when it has an approved completed verification.
    CredentialTypeCollectionResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: Credential types available for submission.
          items:
            "$ref": "#/components/schemas/CredentialTypeResponse"
    CredentialTypeResponse:
      type: object
      required:
        - credentialType
        - name
        - description
      properties:
        credentialType:
          "$ref": "#/components/schemas/CredentialType"
        name:
          type: string
          readOnly: true
          description: Human readable credential name.
          example: Master plumber
        description:
          type: string
          readOnly: true
          description: Human readable explanation of the credential.
          example: User holds a master plumber qualification.
    PublicProfileCollectionResponse:
      type: object
      required:
        - items
        - cursor
      properties:
        items:
          type: array
          description: Public profiles.
          items:
            "$ref": "#/components/schemas/PublicProfileResponse"
        cursor:
          "$ref": "#/components/schemas/Cursor"
    PrivateUserProfileCollectionResponse:
      type: object
      required:
        - items
        - cursor
      properties:
        items:
          type: array
          description: Private user profiles.
          items:
            "$ref": "#/components/schemas/PrivateUserProfileResponse"
        cursor:
          "$ref": "#/components/schemas/Cursor"
    CredentialCollectionResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: Credentials.
          items:
            "$ref": "#/components/schemas/CredentialResponse"
    CredentialVerificationCollectionResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: Credential verification attempts.
          items:
            "$ref": "#/components/schemas/CredentialVerificationResponse"
    BaseUserProfileResponse:
      type: object
      description: Base profile response fields. In private profile responses these fields are always present, but several values may be null while the user profile is still in an incomplete shell state.
      required:
        - userId
        - username
        - firstName
        - lastName
        - userType
        - bio
        - simplifiedBio
        - selfSummary
        - accessibilityPreferences
        - profileMedia
      properties:
        userId:
          type: string
          format: uuid
          readOnly: true
          description: User profile identifier.
        username:
          oneOf:
            - "$ref": "#/components/schemas/Username"
            - type: "null"
        firstName:
          oneOf:
            - "$ref": "#/components/schemas/FirstName"
            - type: "null"
        lastName:
          oneOf:
            - "$ref": "#/components/schemas/LastName"
            - type: "null"
        userType:
          oneOf:
            - "$ref": "#/components/schemas/UserType"
            - type: "null"
        bio:
          oneOf:
            - "$ref": "#/components/schemas/Bio"
            - type: "null"
        simplifiedBio:
          "$ref": "#/components/schemas/SimplifiedBio"
        selfSummary:
          oneOf:
            - "$ref": "#/components/schemas/SelfSummary"
            - type: "null"
        accessibilityPreferences:
          type: array
          uniqueItems: true
          items:
            "$ref": "#/components/schemas/AccessibilityPreference"
        profileMedia:
          oneOf:
            - "$ref": "#/components/schemas/ProfileMediaResponse"
            - type: "null"
          readOnly: true
          description: Current profile picture media. This field is output only and is managed through PUT/DELETE /v1/users/{userId}/profile-picture.
    PublicProfileResponse:
      type: object
      required:
        - userId
        - username
        - firstName
        - lastName
        - userType
        - bio
        - simplifiedBio
        - selfSummary
        - accessibilityPreferences
        - profileMedia
        - verified
      properties:
        userId:
          type: string
          format: uuid
          readOnly: true
          description: User profile identifier.
        username:
          "$ref": "#/components/schemas/Username"
        firstName:
          "$ref": "#/components/schemas/FirstName"
        lastName:
          "$ref": "#/components/schemas/LastName"
        userType:
          "$ref": "#/components/schemas/UserType"
        bio:
          oneOf:
            - "$ref": "#/components/schemas/Bio"
            - type: "null"
        simplifiedBio:
          "$ref": "#/components/schemas/SimplifiedBio"
        selfSummary:
          oneOf:
            - "$ref": "#/components/schemas/SelfSummary"
            - type: "null"
        accessibilityPreferences:
          type: array
          uniqueItems: true
          items:
            "$ref": "#/components/schemas/AccessibilityPreference"
        profileMedia:
          oneOf:
            - "$ref": "#/components/schemas/ProfileMediaResponse"
            - type: "null"
          readOnly: true
          description: Current profile picture media. This field is output only and is managed through PUT/DELETE /v1/users/{userId}/profile-picture.
        verified:
          type: boolean
          readOnly: true
          description: Indicates whether the public profile has at least one visible credential with an approved completed verification.
    PublicProfileCredentialCollectionResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: Public verified credential summaries for a public profile.
          items:
            "$ref": "#/components/schemas/VerifiedCredentialResponse"
    PrivateUserProfileResponse:
      allOf:
        - "$ref": "#/components/schemas/BaseUserProfileResponse"
        - type: object
          required:
            - registrationComplete
            - isPublic
            - privateAddress
          properties:
            registrationComplete:
              type: boolean
              readOnly: true
              description: Indicates whether registration/profile setup is complete for this user profile. This value is controlled by backend registration logic and may become true as a side effect of a successful profile update once the profile leaves its shell state.
            isPublic:
              type: boolean
              description: Indicates whether the user wants the profile to be publicly visible. A profile is publicly accessible only when isPublic is true and registrationComplete is true.
            privateAddress:
              oneOf:
                - "$ref": "#/components/schemas/UserAddressResponse"
                - type: "null"
    BaseCredentialResponse:
      type: object
      required:
        - credentialType
        - name
        - description
        - expiresAt
      properties:
        credentialType:
          "$ref": "#/components/schemas/CredentialType"
        name:
          type: string
          readOnly: true
          description: Human readable credential name.
          example: Master plumber
        description:
          type: string
          readOnly: true
          description: Human readable explanation of the credential.
          example: User holds a master plumber qualification.
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
          description: Date and time when the credential expires. Null if the credential does not expire.
    VerifiedCredentialResponse:
      allOf:
        - "$ref": "#/components/schemas/BaseCredentialResponse"
        - type: object
          required:
            - verifiedAt
          properties:
            verifiedAt:
              type: string
              format: date-time
              readOnly: true
              description: Date and time when the credential verification was approved.
    CredentialResponse:
      allOf:
        - "$ref": "#/components/schemas/BaseCredentialResponse"
        - type: object
          required:
            - credentialId
            - isVisible
            - evidenceMedia
            - createdAt
            - latestVerification
          properties:
            credentialId:
              type: string
              format: uuid
              readOnly: true
              description: Credential identifier.
            isVisible:
              type: boolean
              description: Whether the credential may appear in public profile verification badge data when it has an approved completed verification.
            evidenceMedia:
              "$ref": "#/components/schemas/ProfileMediaResponse"
              readOnly: true
            createdAt:
              type: string
              format: date-time
              readOnly: true
              description: Date and time when the credential submission was created.
            latestVerification:
              oneOf:
                - "$ref": "#/components/schemas/CredentialVerificationResponse"
                - type: "null"
              readOnly: true
              description: Latest verification attempt for this credential, or null when no verification exists yet.
    CredentialVerificationResponse:
      type: object
      required:
        - verificationId
        - status
        - result
        - feedback
        - createdAt
        - completedAt
      properties:
        verificationId:
          type: string
          format: uuid
          readOnly: true
          description: Credential verification identifier.
        status:
          "$ref": "#/components/schemas/CredentialVerificationStatus"
        result:
          oneOf:
            - "$ref": "#/components/schemas/CredentialVerificationResult"
            - type: "null"
          readOnly: true
          description: Verification result. Null while verification is queued or processing, and may remain null if verification fails before a decision is produced.
        feedback:
          type:
            - string
            - "null"
          readOnly: true
          description: Short verification feedback intended for the credential owner. Null until feedback is available.
          example: The evidence appears to support this credential.
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Date and time when the verification resource was created.
        completedAt:
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
          description: Date and time when verification finished. Null while verification is queued or processing.
    Username:
      type: string
      minLength: 3
      maxLength: 50
      pattern: "^[a-z0-9_]+$"
      description: Public username. Only lowercase letters, numbers, and underscores are allowed.
      example: anna_schmidt
    FirstName:
      type: string
      minLength: 1
      maxLength: 100
      pattern: "^[A-Za-zÄÖÜäöü](?:[^0-9]*[^0-9\\s])?$"
      description: First name. The value must start with a letter, must not contain numbers, and must not end with whitespace.
      example: Anna
    LastName:
      type: string
      minLength: 1
      maxLength: 100
      pattern: "^[A-Za-zÄÖÜäöü](?:[^0-9]*[^0-9\\s])?$"
