      description: "Creates a schedule exception for the given date. BLOCKED marks the provider fully unavailable (startTime/endTime must be null). AVAILABLE adds an extra window outside recurring hours (startTime and endTime required, endTime must be after startTime). Only one exception per date is allowed; duplicate dates are rejected with 409."
