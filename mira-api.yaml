openapi: "3.1.0"
info:
  title: Mira API
  version: "1.0.0"
  description: This API describes the backend of Mira, a platform for offering and booking services. It enables users to search for service providers, view service details, manage bookings, communicate with each other, and handle payments and scheduling. The platform is designed to support everyday local services in a simple and accessible way.
servers:
  - url: "http://127.0.0.1:8081"
    description: Local development backend server for the Mira REST API
tags:
  - name: Auth
    description: Authentication resources for OAuth2 login, callback handling, logout, and token refresh.
  - name: Users
    description: Private user profile resources. These routes expose authenticated private profile representations and profile updates. Collection reads are restricted to admin accounts.
  - name: Public Profiles
    description: Publicly visible user profile projections used for discovery and profile viewing.
  - name: Credentials
    description: Credential catalog and private credential resources attached to user profiles. These routes expose available credential types and authenticated credential representations used for submission, visibility, and deletion.
  - name: Credential Verifications
    description: Verification resources for asynchronous evaluation of submitted user credentials.
  - name: Listings (Public)
    description: Public listing discovery resources.
  - name: Listings (Author)
    description: Listing resources managed by listing authors.
  - name: Listings (Reports)
    description: Listing reporting and moderation resources.
  - name: Listings (Media)
    description: Listing media resources.
  - name: Bookings
    description: Booking discovery, request, lifecycle, and delivery confirmation resources.
  - name: Calendar
    description: Calendar views of bookings for authenticated users.
  - name: Schedule
    description: Provider weekly schedule resources used to compute availability.
  - name: Exceptions
    description: Schedule exception resources. Providers use these to block time off or add extra availability on specific dates, overriding their recurring weekly schedule.
paths:
  "/auth/login/google":
    get:
      tags:
        - Auth
      summary: Start OAuth2 login
      description: Starts the OAuth2 authorization code flow with Google.
      responses:
        "302":
          description: Redirects the browser to the Google authorization endpoint.
          headers:
            Location:
              description: Google OAuth 2.0 authorization endpoint URL for an OpenID Connect authorization code flow with PKCE.
              required: true
              schema:
                type: string
                format: uri
                example: "https://accounts.google.com/o/oauth2/v2/auth?response_type=code&client_id=113909603744-a8iqpkeu4nrf5c8nfkeumnleregp3iqq.apps.googleusercontent.com&scope=openid%20profile%20email&state=generated-state&redirect_uri=http://localhost:8081/auth/callback/google&nonce=generated-nonce&code_challenge=generated-code-challenge&code_challenge_method=S256"
  "/auth/callback/google":
    get:
      tags:
        - Auth
      summary: Handle OAuth2 provider callback
      description: Browser callback endpoint used by Google after the authorization code flow. Google redirects the user agent to this route with either an authorization code and state, or an OAuth error.
      parameters:
        - name: code
          in: query
          required: false
          description: Authorization code returned by the OAuth2 provider on success.
          schema:
            type: string
            example: ""
        - name: state
          in: query
          required: false
          description: State value returned by the OAuth2 provider; the backend compares it with the original value to protect against XSRF.
          schema:
            type: string
            example: ""
        - name: error
          in: query
          required: false
          description: OAuth2 error code returned by the provider when authorization fails.
          schema:
            type: string
            example: ""
        - name: error_description
          in: query
          required: false
          description: Optional provider-supplied description of the OAuth2 error.
          schema:
            type: string
            example: ""
      responses:
        "302":
          description: OAuth2 callback processed; browser is redirected.
          headers:
            Location:
              description: Post-login frontend redirect URL. Authentication failures are redirected with an OAuth2 failure indicator.
              required: true
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: Refresh token cookie set after a successful OAuth2 login.
              required: false
              schema:
                type: string
  "/v1/auth/refresh":
    post:
      tags:
        - Auth
      operationId: refresh
      summary: Refresh access token
      description: Uses the refresh token from the HttpOnly refresh cookie to issue a new access token and renew the refresh cookie.
      security:
        - refreshTokenCookieAuthentication: []
      responses:
        "200":
          description: Access token refreshed successfully.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/TokenResponse"
        "401":
          description: Unauthorized. Refresh token is missing, invalid, expired, or has been invalidated.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
  "/v1/auth/logout":
    post:
      tags:
        - Auth
      operationId: logout
      summary: Logout account
      description: Invalidates all currently issued Mira access and refresh tokens for the authenticated account and clears the refresh cookie.
      security:
        - bearerHttpAuthentication: []
      responses:
        "204":
          description: Logout completed successfully. The refresh token cookie is expired in the response.
        "401":
          description: Unauthorized. Authentication is required.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
  "/v1/users":
    get:
      tags:
        - Users
      operationId: getPrivateUserProfileCollection
      summary: List private user profiles
      description: Returns a cursor-paginated collection of private user profile resources. Access is restricted to admin accounts.
      parameters:
        - name: free-query
          in: query
          required: false
          description: Free search string matched against username, firstName, and lastName.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - "$ref": "#/components/parameters/LimitQueryParam"
        - "$ref": "#/components/parameters/FromQueryParam"
      security:
        - bearerHttpAuthentication: []
      responses:
        "200":
          description: Private user profiles retrieved successfully.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PrivateUserProfileCollectionResponse"
        "400":
          description: Bad Request. One or more query parameters are invalid.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
        "401":
          description: Unauthorized. Authentication is required.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
        "403":
          description: Forbidden. The authenticated account is not allowed to access this resource.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
  "/v1/users/{userId}":
    get:
      tags:
        - Users
      operationId: getPrivateUserProfile
      summary: Get private user profile
      description: Returns the private user profile identified by userId. Access is allowed when the authenticated account owns the target user profile or is an admin account. Private profiles may still be in an incomplete shell state. In that case, the response object still contains the documented response fields, but profile values that have not been provided yet are returned as null.
      security:
        - bearerHttpAuthentication: []
      parameters:
        - "$ref": "#/components/parameters/UserIdPathParam"
      responses:
        "200":
          description: Private user profile retrieved successfully.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PrivateUserProfileResponse"
              examples:
                completedProviderProfile:
                  summary: Completed provider profile
                  value:
                    userId: "22bb22bb-2222-2222-2222-bbbbbbbbbbbb"
                    username: anna_schmidt
                    firstName: Anna
                    lastName: Schmidt
                    userType: PROVIDER
                    bio: I support people with laptop setup, software installation, and basic troubleshooting.
                    simplifiedBio: null
                    selfSummary: Laptop setup and software support
                    accessibilityPreferences:
                      - EASY_LANGUAGE
                      - REDUCED_MOTION
                    profileMedia: null
                    registrationComplete: true
                    isPublic: true
                    privateAddress:
                      street: "Brunnenstraße"
                      houseNumber: "25"
                      city: Berlin
                      postalCode: "10119"
                shellProfile:
                  summary: Incomplete shell profile
                  value:
                    userId: "11aa11aa-1111-1111-1111-aaaaaaaaaaaa"
                    username: null
                    firstName: null
                    lastName: null
                    userType: null
                    bio: null
                    simplifiedBio: null
                    selfSummary: null
                    accessibilityPreferences: []
                    profileMedia: null
                    registrationComplete: false
                    isPublic: false
                    privateAddress: null
        "400":
          description: Bad Request. One or more path or query parameters are invalid.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
        "401":
          description: Unauthorized. Authentication is required.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
        "403":
          description: Forbidden. The authenticated account is not allowed to access this resource.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
        "404":
          description: Not Found. No resource exists for the given identifier.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
    patch:
      tags:
        - Users
      operationId: patchUserProfile
      summary: Update user profile
      description: Partially updates the user profile identified by userId. Access is allowed when the authenticated account owns the target user profile or is an admin account. The request can update username, firstName, lastName, bio, selfSummary, isPublic, accessibilityPreferences, and privateAddress. Omitted fields are left unchanged. Fields set to null are also left unchanged. simplifiedBio cannot be updated through this route. profileMedia is read-only in profile responses and cannot be set or cleared through this route; use PUT /v1/users/{userId}/profile-picture and DELETE /v1/users/{userId}/profile-picture instead. If a non-null bio is provided and differs from the currently stored bio, the backend synchronously asks the configured language model service to generate simplifiedBio before persisting any profile changes. If that simplification service is unavailable, the request fails with 503 and no profile changes are persisted. If the provided bio equals the currently stored bio, the existing bio and simplifiedBio are left unchanged and no language model call is made. If privateAddress is provided as an object, it must be provided as a complete address object. accessibilityPreferences replaces the complete preference set when provided. This operation may also cause registrationComplete to change as a service-calculated side effect when the update provides the data required for the user profile to leave its shell state. registrationComplete cannot be set explicitly in the request payload. Clients can observe the resulting private profile state through GET /v1/users/{userId}.
      security:
        - bearerHttpAuthentication: []
      parameters:
        - "$ref": "#/components/parameters/UserIdPathParam"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PatchUserProfileRequest"
      responses:
        "200":
          description: User profile updated successfully. The backend may also mark registration as complete as part of the same update if the shell state ends.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PrivateUserProfileResponse"
        "400":
          description: Bad Request. The request payload is invalid.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
        "401":
          description: Unauthorized. Authentication is required.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
        "403":
          description: Forbidden. The authenticated account is not allowed to access this resource.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
        "404":
          description: Not Found. No resource exists for the given identifier.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
        "409":
          description: Conflict. The request conflicts with the current resource state.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
        "503":
          description: Service Unavailable. The profile update requires simplifiedBio generation for a changed bio, but the configured language model service is temporarily unavailable. No profile changes are persisted.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
  "/v1/users/{userId}/profile-picture":
    put:
      tags:
        - Users
      operationId: uploadProfilePicture
      summary: Upload or replace profile picture
      description: Uploads or replaces the profile picture for the user profile identified by userId. The backend links the uploaded media as the user's current profileMedia and retires any previous profile picture. This route uses PUT because the client-facing operation replaces the user's profile-picture slot and is treated as idempotent. The response is 200 rather than 201 because the operation updates that slot instead of exposing a newly created canonical media resource. profileMedia cannot be set or cleared through PATCH /v1/users/{userId}.
      security:
        - bearerHttpAuthentication: []
      parameters:
        - "$ref": "#/components/parameters/UserIdPathParam"
      requestBody:
        required: true
        content:
          "multipart/form-data":
            schema:
              "$ref": "#/components/schemas/UploadProfilePictureRequest"
      responses:
        "200":
          description: Profile picture uploaded and linked successfully.
          content:
            "application/hal+json":
              schema:
                "$ref": "#/components/schemas/ProfileMediaEntityModel"
        "400":
          description: Bad Request. The uploaded file or path parameter is invalid.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
              example:
                type: "https://api.mira.example/problems/invalid-request-parameter"
                title: "Bad Request"
                status: 400
                detail: "Required request part 'file' is not present"
                instance: "/v1/users/11111111-2222-3333-4444-555555555555/profile-picture"
        "401":
          description: Unauthorized. Authentication is required.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
              example:
                type: "https://api.mira.example/problems/unauthorized"
                title: "Unauthorized"
                status: 401
                detail: "Full authentication is required to access this resource"
                instance: "/v1/users/11111111-2222-3333-4444-555555555555/profile-picture"
        "403":
          description: Forbidden. The authenticated account is not allowed to update this user profile.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
              example:
                type: "https://api.mira.example/problems/forbidden"
                title: "Forbidden"
                status: 403
                detail: "You are not allowed to modify this user profile"
                instance: "/v1/users/11111111-2222-3333-4444-555555555555/profile-picture"
        "404":
          description: Not Found. No user profile exists for the given userId.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
              example:
                type: "https://api.mira.example/problems/user-not-found"
                title: "Not Found"
                status: 404
                detail: "User not found: 11111111-2222-3333-4444-555555555555"
                instance: "/v1/users/11111111-2222-3333-4444-555555555555/profile-picture"
        "413":
          description: Payload Too Large. The file exceeds the 5 MB size limit (5,242,880 bytes).
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
              example:
                type: "https://api.mira.example/problems/media-file-too-large"
                title: "Payload Too Large"
                status: 413
                detail: "Uploaded media size 6291456 exceeds maximum allowed size 5242880"
                instance: "/v1/users/11111111-2222-3333-4444-555555555555/profile-picture"
        "415":
          description: Unsupported Media Type. Only image/jpeg and image/png are accepted.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
              example:
                type: "https://api.mira.example/problems/unsupported-media-type"
                title: "Unsupported Media Type"
                status: 415
                detail: "Media type image/gif is not supported. Allowed types: image/jpeg, image/png"
                instance: "/v1/users/11111111-2222-3333-4444-555555555555/profile-picture"
        "422":
          description: Unprocessable Entity. Triggered when image dimensions cannot be determined, when the image is below the 200×200 pixel minimum, or when the total pixel count exceeds 25,000,000.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
              example:
                type: "https://api.mira.example/problems/invalid-image-dimensions"
                title: "Unprocessable Entity"
                status: 422
                detail: "Image dimensions 150x100 are below the minimum allowed size 200x200"
                instance: "/v1/users/11111111-2222-3333-4444-555555555555/profile-picture"
    delete:
      tags:
        - Users
      operationId: deleteProfilePicture
      summary: Delete profile picture
      description: Removes the current profile picture from the user profile identified by userId. The backend unlinks profileMedia, soft-deletes the media record, and removes the stored file after the transaction commits. If the user exists but has no current profile picture, the request returns 404. This still keeps DELETE idempotent because repeated deletion attempts do not change server state after the first successful deletion.
      security:
        - bearerHttpAuthentication: []
      parameters:
        - "$ref": "#/components/parameters/UserIdPathParam"
      responses:
        "204":
          description: Profile picture removed successfully. No response body is returned.
        "400":
          description: Bad Request. The path parameter is invalid.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
              example:
                type: "https://api.mira.example/problems/invalid-request-parameter"
                title: "Bad Request"
                status: 400
                detail: "Failed to convert 'userId' with value 'not-a-uuid' to required type UUID"
                instance: "/v1/users/not-a-uuid/profile-picture"
        "401":
          description: Unauthorized. Authentication is required.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
              example:
                type: "https://api.mira.example/problems/unauthorized"
                title: "Unauthorized"
                status: 401
                detail: "Full authentication is required to access this resource"
                instance: "/v1/users/11111111-2222-3333-4444-555555555555/profile-picture"
        "403":
          description: Forbidden. The authenticated account is not allowed to update this user profile.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
              example:
                type: "https://api.mira.example/problems/forbidden"
                title: "Forbidden"
                status: 403
                detail: "You are not allowed to modify this user profile"
                instance: "/v1/users/11111111-2222-3333-4444-555555555555/profile-picture"
        "404":
          description: Not Found. No user profile exists for the given userId, or the user has no current profile picture.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
              example:
                type: "https://api.mira.example/problems/media-not-found"
                title: "Not Found"
                status: 404
                detail: "Profile picture not found for user: 11111111-2222-3333-4444-555555555555"
                instance: "/v1/users/11111111-2222-3333-4444-555555555555/profile-picture"
  "/v1/public-profile-pictures/{userId}/content":
    get:
      tags:
        - Public Profiles
      operationId: getPublicProfilePictureContent
      summary: Get public profile picture content
      description: Streams the current profile-picture bytes for the identified user. Profile pictures are intentionally public independently of the user's profile visibility. This route never exposes the internal media storage path.
      parameters:
        - "$ref": "#/components/parameters/UserIdPathParam"
      responses:
        "200":
          description: Current profile picture content retrieved successfully.
          content:
            "image/jpeg":
              schema:
                type: string
                format: binary
            "image/png":
              schema:
                type: string
                format: binary
        "404":
          description: Not Found. The user has no current profile picture or its stored content is unavailable.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
  "/v1/public-profiles":
    get:
      tags:
        - Public Profiles
      operationId: getPublicProfilesCollection
      summary: Search public profiles
      description: Returns a cursor-paginated collection of public profiles. A user profile is publicly eligible only when registrationComplete is true and isPublic is true. Incomplete profiles and profiles with public visibility disabled are never included.
      parameters:
        - name: free-query
          in: query
          required: false
          description: Free search string matched against username, firstName, and lastName.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - "$ref": "#/components/parameters/LimitQueryParam"
        - "$ref": "#/components/parameters/FromQueryParam"
      responses:
        "200":
          description: Public profiles retrieved successfully.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PublicProfileCollectionResponse"
        "400":
          description: Bad Request. One or more query parameters are invalid.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
  "/v1/public-profiles/{userId}":
    get:
      tags:
        - Public Profiles
      operationId: getPublicProfile
      summary: Get public profile
      description: Returns the public profile identified by userId, including whether the profile has at least one visible approved credential. A user profile is publicly eligible only when registrationComplete is true and isPublic is true. If the user profile does not exist, registration is incomplete, or public visibility is disabled, no public profile is returned. The response intentionally does not reveal which of these cases applies.
      parameters:
        - "$ref": "#/components/parameters/UserIdPathParam"
      responses:
        "200":
          description: Public profile retrieved successfully.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PublicProfileResponse"
        "400":
          description: Bad Request. One or more path or query parameters are invalid.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
        "404":
          description: Not Found. No public profile exists for the given userId. This response intentionally does not reveal whether the user is missing, incomplete, or not public.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
  "/v1/public-profiles/{userId}/credentials":
    get:
      tags:
        - Public Profiles
      operationId: getPublicProfileCredentials
      summary: List public profile credentials
      description: Returns public verified credential summaries for the public profile identified by userId. The parent user profile must be publicly eligible, meaning registrationComplete is true and isPublic is true. Only credentials with isVisible set to true, a completed approved verification, and no past expiration date are included. Evidence media, hidden credentials, pending credentials, denied credentials, failed verifications, and verification feedback are never exposed through this public projection.
      parameters:
        - "$ref": "#/components/parameters/UserIdPathParam"
      responses:
        "200":
          description: Public profile credentials retrieved successfully.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PublicProfileCredentialCollectionResponse"
        "400":
          description: Bad Request. One or more path parameters are invalid.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
        "404":
          description: Not Found. No public profile exists for the given userId. This response intentionally does not reveal whether the user is missing, incomplete, or not public.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
  "/v1/credentials":
    get:
      tags:
        - Credentials
      summary: List credential types
      description: Returns the credential catalog available for provider credential submissions. Clients use this list to populate credential-type selection controls.
      responses:
        "200":
          description: Credential catalog retrieved successfully.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CredentialTypeCollectionResponse"
  "/v1/users/{userId}/credentials":
    get:
      tags:
        - Credentials
      summary: List credentials
      description: Returns all credential submissions attached to the user profile identified by userId. This includes hidden credentials and their latest verification summary when one exists. Access is allowed when the authenticated account owns the target user profile or is an admin account.
      security:
        - bearerHttpAuthentication: []
      parameters:
        - "$ref": "#/components/parameters/UserIdPathParam"
      responses:
        "200":
          description: Credentials retrieved successfully.
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CredentialCollectionResponse"
        "400":
          description: Bad Request. One or more path or query parameters are invalid.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
        "401":
          description: Unauthorized. Authentication is required.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
        "403":
          description: Forbidden. The authenticated account is not allowed to access this resource.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
        "404":
          description: Not Found. No resource exists for the given identifier.
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetailsResponse"
    post:
      tags:
        - Credentials
      summary: Submit credential
      description: Submits one credential claim for the user profile identified by userId. Access is allowed only when the authenticated account owns the target provider profile. The multipart request references a catalog credential type and one uploaded evidence file. If accepted, the backend creates a credential submission with isVisible set to false. Verification is represented by separate verification resources.
      security:
        - bearerHttpAuthentication: []
      parameters:
        - "$ref": "#/components/parameters/UserIdPathParam"
      requestBody:
        required: true
        content:
          "multipart/form-data":
            schema:
              "$ref": "#/components/schemas/SubmitCredentialRequest"
      responses:
        "201":
          description: Credential submitted successfully.
          headers:
            Location:
              description: URI of the created credential.
              required: true
              schema:
                type: string
                format: uri-reference
                examples:
                  - /v1/users/223e4567-e89b-12d3-a456-426614174000/credentials/423e4567-e89b-12d3-a456-426614174000
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CredentialResponse"
        "400":
          description: Bad Request. The request payload is invalid.
          content:
